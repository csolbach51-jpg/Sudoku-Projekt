name: Java CI mit Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Code auschecken
      uses: actions/checkout@v4

    # Von Java 17 auf Java 21 aktualisiert, passend zu deinem Gradle-Projekt
    # Zudem den Gradle-Cache aktiviert, um den Build zu beschleunigen
    name: Java JDK 21 einrichten
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Gradle ausführbar machen
      run: chmod +x gradlew

    - name: Bauen mit Gradle
      run: ./gradlew build

    - name: JAR Datei speichern (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Sudoku-Spiel
        path: build/libs/*.jar
